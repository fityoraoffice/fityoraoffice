<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <circle cx="200" cy="100" r="80" fill="#7aa2f7" opacity="0.15" filter="url(#blur)">
    <animate attributeName="cx" values="200;250;200" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="120" r="100" fill="#bb9af7" opacity="0.15" filter="url(#blur)">
    <animate attributeName="cx" values="1000;950;1000" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g fill="#7dcfff" opacity="0.7">
    <circle cx="100" cy="50" r="2">
      <animate attributeName="cy" values="50;170;50" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="120" r="3">
      <animate attributeName="cy" values="120;30;120" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="70" r="2">
      <animate attributeName="cy" values="70;180;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="140" r="2">
      <animate attributeName="cy" values="140;40;140" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="80" r="3">
      <animate attributeName="cy" values="80;170;80" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="150" r="2">
      <animate attributeName="cy" values="150;50;150" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="105" text-anchor="middle" font-family="Fira Code, monospace" font-size="56" font-weight="800" fill="#ffffff">
    Fityora Office
    <animate attributeName="opacity" values="1;0.85;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="145" text-anchor="middle" font-family="Fira Code, monospace" font-size="18" fill="#7aa2f7" letter-spacing="2">
    FULLSTACK DEVELOPER · OPEN SOURCE ENTHUSIAST
  </text>

  <path d="M0,190 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,220 L0,220 Z" fill="url(#wave1)" opacity="0.4">
    <animate attributeName="d" values="M0,190 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,220 L0,220 Z;M0,175 Q150,195 300,175 T600,175 T900,175 T1200,175 L1200,220 L0,220 Z;M0,190 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,220 L0,220 Z" dur="5s" repeatCount="indefinite"/>
  </path>
  <path d="M0,200 Q150,180 300,195 T600,195 T900,195 T1200,195 L1200,220 L0,220 Z" fill="url(#wave2)" opacity="0.3">
    <animate attributeName="d" values="M0,200 Q150,180 300,195 T600,195 T900,195 T1200,195 L1200,220 L0,220 Z;M0,190 Q150,205 300,190 T600,190 T900,190 T1200,190 L1200,220 L0,220 Z;M0,200 Q150,180 300,195 T600,195 T900,195 T1200,195 L1200,220 L0,220 Z" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
