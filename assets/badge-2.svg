<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#shine)"/>

  <text x="35" y="38" font-family="Segoe UI Emoji, sans-serif" font-size="22">🚀</text>
  <text x="70" y="38" font-family="Fira Code, monospace" font-size="14" font-weight="700" fill="#bb9af7">FIRST PULL REQUEST</text>
</svg>
