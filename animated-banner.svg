<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Floating particles -->
  <circle cx="100" cy="50" r="3" fill="#7aa2f7" opacity="0.6">
    <animate attributeName="cy" values="50;150;50" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="120" r="2" fill="#bb9af7" opacity="0.5">
    <animate attributeName="cy" values="120;40;120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="80" r="4" fill="#7dcfff" opacity="0.4">
    <animate attributeName="cy" values="80;160;80" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="100" r="2" fill="#7aa2f7" opacity="0.7">
    <animate attributeName="cy" values="100;30;100" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="70" r="3" fill="#bb9af7" opacity="0.5">
    <animate attributeName="cy" values="70;150;70" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="130" r="2" fill="#7dcfff" opacity="0.6">
    <animate attributeName="cy" values="130;50;130" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text x="600" y="95" text-anchor="middle" font-family="Fira Code, monospace" font-size="52" font-weight="700" fill="#ffffff">
    Fityora Office
    <animate attributeName="opacity" values="1;0.7;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="135" text-anchor="middle" font-family="Fira Code, monospace" font-size="18" fill="#7aa2f7">
    Fullstack Developer · Open Source Enthusiast
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Wave bottom -->
  <path d="M0,180 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,200 L0,200 Z" fill="url(#wave)" opacity="0.3">
    <animate attributeName="d" values="M0,180 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,200 L0,200 Z;M0,170 Q150,190 300,170 T600,170 T900,170 T1200,170 L1200,200 L0,200 Z;M0,180 Q150,160 300,180 T600,180 T900,180 T1200,180 L1200,200 L0,200 Z" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>
