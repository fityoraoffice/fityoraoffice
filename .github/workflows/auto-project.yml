name: Auto Update Projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get repos and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              sort: 'updated',
              per_page: 10,
              type: 'owner'
            });

            const filtered = repos.filter(r => !r.fork && r.name !== context.repo.owner);
            let projects = '';

            filtered.forEach((repo, i) => {
              const desc = repo.description || 'No description';
              const lang = repo.language || 'Code';
              const stars = repo.stargazers_count > 0 ? `⭐ ${repo.stargazers_count} ` : '';
              projects += `| **[${repo.name}](${repo.html_url})** | ${desc} | ${stars}· ${lang} |\n`;
            });

            let readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- PROJECTS-START -->';
            const end = '<!-- PROJECTS-END -->';
            const table = `${start}\n| Repository | Description | Meta |\n|---|---|---|\n${projects}${end}`;

            const regex = new RegExp(`${start}[\\s\\S]*?${end}`);
            if (readme.match(regex)) {
              readme = readme.replace(regex, table);
            } else {
              readme = readme + '\n\n' + table + '\n';
            }

            fs.writeFileSync('README.md', readme);
